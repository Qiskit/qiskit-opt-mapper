---
other:
  - |
    The ``higher_order`` argument of
    :meth:`~qiskit_addon_opt_mapper.OptimizationProblem.minimize` and
    :meth:`~qiskit_addon_opt_mapper.OptimizationProblem.maximize` is now annotated as a
    dictionary of ``{order: coeffs}``, which is the only form that was accepted at runtime.
    The behavior of both methods is unchanged.
  - |
    :meth:`~qiskit_addon_opt_mapper.OptimizationProblem.substitute_variables` now returns a
    problem of the same class as its input.
